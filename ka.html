        let map;
        let infoWindow;
        let routePoints = [];
        let directionsService;
        let directionsRenderer;
        
        function initMap() {
            const karnatakaCenter = { lat: 15.3173, lng: 75.7139 };
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 7,
                center: karnatakaCenter,
            });
            
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer();
            directionsRenderer.setMap(map);

            infoWindow = new google.maps.InfoWindow();

            showCurrentLocation();

            locations.forEach((location, index) => {
                const marker = new google.maps.Marker({
                    position: { lat: location.lat, lng: location.lng },
                    map: map,
                    title: location.name,
                });

                marker.addListener("click", () => {
                    const content = `
                        <div class="info-window-content">
                            ${location.name}
                            <button class="add-route-btn" onclick="addToRoute(${index})">Add to Route</button>
                            <button class="open-gmaps-btn" onclick="openInGoogleMaps(${location.lat}, ${location.lng})">Open in Google Maps</button>
                        </div>`;
                    infoWindow.setContent(content);
                    infoWindow.open(map, marker);
                });
            });

            document.getElementById("calculateRouteBtn").addEventListener("click", calculateAndDisplayRoute);
        }

        function showCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const pos = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                        };
                        // <!-- MODIFIED: Added icon property for blue dot -->
                        new google.maps.Marker({
                            position: pos,
                            map,
                            title: "Your Location",
                            icon: {
                                url: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
                            }
                        });
                        map.setCenter(pos);
                        map.setZoom(10);
                    },
                    () => {
                        console.log("Error: The Geolocation service failed or was denied.");
                    }
                );
            } else {
                console.log("Error: Your browser doesn't support geolocation.");
            }
        }

        function openInGoogleMaps(lat, lng) {
            const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
            window.open(url, '_blank');
        }

        function addToRoute(locationIndex) {
            const selectedLocation = locations[locationIndex];
            
            if (routePoints.find(p => p.name === selectedLocation.name)) {
                alert(selectedLocation.name + " is already in the route.");
                return;
            }

            routePoints.push(selectedLocation);
            updateSelectedLocationsList();
            infoWindow.close();
        }

        function updateSelectedLocationsList() {
            const listElement = document.getElementById("selectedLocationsList");
            listElement.innerHTML = "";

            routePoints.forEach(point => {
                const listItem = document.createElement("li");
                listItem.textContent = point.name;
                listElement.appendChild(listItem);
            });
            
            const calcBtn = document.getElementById("calculateRouteBtn");
            if (routePoints.length >= 2) {
                calcBtn.disabled = false;
            } else {
                calcBtn.disabled = true;
            }
        }

        function calculateAndDisplayRoute() {
            if (routePoints.length < 2) {
                alert("Please select at least two locations to calculate a route.");
                return;
            }
            
            directionsRenderer.setDirections({routes: []});
            
            const waypoints = [];
            for (let i = 1; i < routePoints.length - 1; i++) {
                waypoints.push({
                    location: new google.maps.LatLng(routePoints[i].lat, routePoints[i].lng),
                    stopover: true,
                });
            }

            const request = {
                origin: new google.maps.LatLng(routePoints[0].lat, routePoints[0].lng),
                destination: new google.maps.LatLng(routePoints[routePoints.length - 1].lat, routePoints[routePoints.length - 1].lng),
                waypoints: waypoints,
                optimizeWaypoints: true,
                travelMode: google.maps.TravelMode.DRIVING,
            };

            directionsService.route(request, (result, status) => {
                if (status == "OK") {
                    directionsRenderer.setDirections(result);
                } else {
                    window.alert("Directions request failed due to " + status);
                }
            });
        }
