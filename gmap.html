<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Postcard Collection Map with Search</title>
<!-- Google Maps doesn't require a separate CSS file -->
<style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: calc(100vh - 50px);
    }
    #searchBox {
      width: 100%;
      height: 50px;
      box-sizing: border-box;
      font-size: 16px;
      padding: 10px;
      border: none;
      border-bottom: 1px solid #ccc;
      outline: none;
    }
</style>
</head>
<body>
<input type="text" id="searchBox" placeholder="Search by name, pincode, post office, district, collected..." />
<div id="map"></div>


<script src="./checklist/coordsMap.js"></script>

<script>
// This function is called by the Google Maps script once it's loaded.
async function initMap() {
  // Initialize the map
  const map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 22.5937, lng: 78.9629 },
    zoom: 5,
    // Using a standard dark mode style to match the original map
    styles: [ { "elementType": "geometry", "stylers": [ { "color": "#242f3e" } ] }, { "elementType": "labels.text.fill", "stylers": [ { "color": "#746855" } ] }, { "elementType": "labels.text.stroke", "stylers": [ { "color": "#242f3e" } ] }, { "featureType": "administrative.locality", "elementType": "labels.text.fill", "stylers": [ { "color": "#d59563" } ] }, { "featureType": "poi", "elementType": "labels.text.fill", "stylers": [ { "color": "#d59563" } ] }, { "featureType": "poi.park", "elementType": "geometry", "stylers": [ { "color": "#263c3f" } ] }, { "featureType": "poi.park", "elementType": "labels.text.fill", "stylers": [ { "color": "#6b9a76" } ] }, { "featureType": "road", "elementType": "geometry", "stylers": [ { "color": "#38414e" } ] }, { "featureType": "road", "elementType": "geometry.stroke", "stylers": [ { "color": "#212a37" } ] }, { "featureType": "road", "elementType": "labels.text.fill", "stylers": [ { "color": "#9ca5b3" } ] }, { "featureType": "road.highway", "elementType": "geometry", "stylers": [ { "color": "#746855" } ] }, { "featureType": "road.highway", "elementType": "geometry.stroke", "stylers": [ { "color": "#1f2835" } ] }, { "featureType": "road.highway", "elementType": "labels.text.fill", "stylers": [ { "color": "#f3d19c" } ] }, { "featureType": "transit", "elementType": "geometry", "stylers": [ { "color": "#2f3948" } ] }, { "featureType": "transit.station", "elementType": "labels.text.fill", "stylers": [ { "color": "#d59563" } ] }, { "featureType": "water", "elementType": "geometry", "stylers": [ { "color": "#17263c" } ] }, { "featureType": "water", "elementType": "labels.text.fill", "stylers": [ { "color": "#515c6d" } ] }, { "featureType": "water", "elementType": "labels.text.stroke", "stylers": [ { "color": "#17263c" } ] } ]
  });

  // Define icons
  const redIcon = 'https://maps.google.com/mapfiles/ms/icons/red-dot.png';
  const greenIcon = 'https://maps.google.com/mapfiles/ms/icons/green-dot.png';

  const checklistResp = await fetch('./checklist/checklist-data.json');
  const checklist = await checklistResp.json();

  const bounds = new google.maps.LatLngBounds();
  const markers = [];
  const infowindow = new google.maps.InfoWindow(); // Use one InfoWindow for all markers

  for (const item of checklist) {
    const coords = coordsMap[item.pincode];
    if (!coords) continue;
    
    const position = { lat: coords[0], lng: coords[1] };
    const marker = new google.maps.Marker({
        position,
        map,
        icon: item.collected ? greenIcon : redIcon,
    });

    const popupContent = `<strong>${item.name_of_ppc}</strong><br/>Pincode: ${item.pincode}<br/>Post Office: ${item.post_office}<br/>District: ${item.district}<br/>Collected: ${item.collected ? 'Yes' : 'No'}`;
    
    // Add a click listener to show the InfoWindow
    marker.addListener('click', () => {
        infowindow.setContent(popupContent);
        infowindow.open(map, marker);
    });

    bounds.extend(position);
    markers.push({
      marker,
      searchString: `${item.name_of_ppc} ${item.pincode} ${item.post_office} ${item.district} ${item.collected ? 'yes' : 'no'}`.toLowerCase()
    });
  }

  if (markers.length > 0) {
    map.fitBounds(bounds);
  }

  document.getElementById('searchBox').addEventListener('input', function() {
    const query = this.value.toLowerCase();
    markers.forEach(({ marker, searchString }) => {
      // To hide/show, set the marker's map to null or the map object
      const isVisible = searchString.includes(query);
      marker.setMap(isVisible ? map : null);
    });
  });
}
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCCypgdq5pg0nb8poCOAC7DCkTYLTRXo2I&callback=initMap"></script>

</body>
</html>
